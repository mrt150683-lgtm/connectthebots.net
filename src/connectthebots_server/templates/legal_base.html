<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>{% block title %}Connect the Bots{% endblock %}</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/dark.css">
</head>
<body>
<header class="site-head"><div class="wrap"><a class="brand" href="/">Connect the Bots</a></div></header>
<main class="wrap section legal">
{% if not settings.legal_pages_approved %}<p class="preview-tag">Draft for review · not approved</p><p>This early-access notice needs the operator's details and approval before public sign-in opens.</p>{% endif %}
{% block content %}{% endblock %}
<p><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/contact">Contact</a> · <a href="/signin">Sign in</a></p>
</main>
</body>
</html>
