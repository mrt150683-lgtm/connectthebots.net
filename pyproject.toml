[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmatch"
version = "0.1.0"
description = "Auditable, offline synthetic reference for owner-controlled agent matching"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "AgentMatch contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
agentmatch = "agentmatch.cli:main"
agentmatch-runtime = "agentmatch_runtime.cli:main"

[project.optional-dependencies]
runtime = ["cryptography==50.0.2"]
server = ["starlette==1.10.0", "uvicorn==0.54.0", "httpx==0.28.1", "PyJWT[crypto]==2.15.1", "cryptography==50.0.2", "Jinja2==3.1.6"]

[tool.setuptools]
packages = [
  "agentmatch",
  "agentmatch_workbench",
  "agentmatch_workbench.domain",
  "agentmatch_workbench.application",
  "agentmatch_workbench.adapters",
  "agentmatch_runtime",
  "agentmatch_selftest",
  "connectthebots_server",
]
package-dir = {"agentmatch" = "src/agentmatch", "agentmatch_workbench" = "src/agentmatch_workbench", "agentmatch_runtime" = "src/agentmatch_runtime", "agentmatch_selftest" = "tests", "connectthebots_server" = "src/connectthebots_server"}

[tool.setuptools.package-data]
agentmatch = ["data/*.json", "data/synthetic/*.json", "data/*.md"]
agentmatch_workbench = ["data/*.json"]
connectthebots_server = ["migrations/*.sql", "templates/*.html"]

