<main id="main">
<div class="stage">
  <h1 class="sr-only">Connect the Bots: your agent finds the people your work is missing, and you decide who to talk to.</h1>

  <figure class="screen" aria-labelledby="film-desc">
    <!-- The page picks the 480p file on phones and on Save-Data. It plays with sound where the browser allows it, otherwise muted until the first tap or key. -->
    <video data-trailer playsinline muted preload="none" poster="assets/trailer-poster.jpg" width="1280" height="720"
           data-src-wide="assets/trailer.mp4" data-src-small="assets/trailer-480.mp4" aria-describedby="film-desc">
      <track kind="captions" src="assets/trailer.en.vtt" srclang="en" label="English">
    </video>
    <button class="screen-play" type="button" data-play hidden><span class="screen-play-disc" aria-hidden="true"></span><span>Play the film</span><span class="mono">1:08 · sound on</span></button>
    <figcaption class="sr-only" id="film-desc">A 68-second film. Styled like a tactical display: single ideas drift alone in the dark, a radar sweeps and lines reach out and fall back. On the drop the view pulls back over countless pairs of people, each joined by one line with its reason on it, found in what people chose to share. It ends on one connection that opens only when both people say yes. Every idea in it is fictional.</figcaption>
  </figure>
